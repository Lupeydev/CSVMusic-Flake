name: Auto Update Hash

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-nu@v3
      - uses: DeterminateSystems/determinate-nix-action@v3

      - run: nu ./update.nu
        shell: nu {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Build before committing so a broken update never lands on main
      - run: nix build

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[Auto] Update Hash & Version"
          file_pattern: default.nix